name: Queue

# GitHub's merge queue tests each picked PR on top of main, one at a time, on
# the host's self-hosted runner, and merges exactly the tree it tested. When the
# queue drops a PR, moq-dev/quest's queue watcher on the host runs the land
# fixer and re-enqueues it at the back of the queue.
#
# `main`'s ruleset requires this workflow's `Queue` context. On a pull request,
# queue-pr.yml reports it as skipped; only the merge group build runs code, and
# only a maintainer's pick enters the queue.
#
# A repository without GitHub's merge queue, such as a private one on GitHub
# Team, lands through the watcher's own queue instead. Its base keeps requiring
# the unreported `quest land` context, and its queue workflow, under any name,
# also builds the watcher's queue branches:
#
#   push:
#     branches: ["quest-queue/**"]
#
# The watcher pushes `quest-queue/<base>/<number>`, the base merged into PR
# <number>'s picked head: a merge commit whose second parent (`HEAD^2`) is the
# base it tested. The build runs as for a merge group, and the base's required
# checks besides `quest land`, reported on that commit, decide whether the PR
# lands, so the required job reports the build's result there.
on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# No concurrency group: each merge group has its own ref, so its run never has
# another to replace, and cancelling one would report `Queue` cancelled.

jobs:
  # The build runs in queue-build.yml so its runner group can admit that
  # workflow alone; see that file. It calls main's copy, not the merge group's,
  # since the group admits that workflow only at refs/heads/main: a PR's edit to
  # queue-build.yml runs only after it lands.
  build:
    name: Queue build
    uses: moq-dev/quest/.github/workflows/queue-build.yml@main

  # The required context. A reusable workflow's jobs report as
  # `Queue build / Build`, so this job reports the build's result under the
  # name main's ruleset requires. It runs even when the build fails or is
  # cancelled, since a skipped context would pass the group.
  queue:
    name: Queue
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build to pass
        env:
          RESULT: ${{ needs.build.result }}
        run: '[[ "$RESULT" == success ]] || { echo "::error::the queue build ended $RESULT" >&2; exit 1; }'
